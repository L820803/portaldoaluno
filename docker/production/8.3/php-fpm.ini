[PHP]
; Configurações gerais
post_max_size = 100M
upload_max_filesize = 100M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
max_input_vars = 5000

; Exibição de erros (desabilitado em produção)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php-fpm_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Limites de recursos
max_file_uploads = 20
default_socket_timeout = 60

; Sessões
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440

; Security
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; Realpath cache (melhora performance)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
; OPcache ativado para melhor performance
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Em produção: não validar timestamps (melhor performance)
; IMPORTANTE: Com validate_timestamps=0, mudanças no código
; só aparecem após rebuild da imagem ou reload do PHP-FPM
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Otimizações
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.enable_file_override = 1

; JIT (Just-In-Time compiler do PHP 8+)
opcache.jit = tracing
opcache.jit_buffer_size = 100M

[Date]
date.timezone = America/Porto_Velho

[mysqli]
mysqli.default_socket = /var/run/mysqld/mysqld.sock

[Pdo_mysql]
pdo_mysql.default_socket = /var/run/mysqld/mysqld.sock
