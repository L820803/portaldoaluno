[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:npm]
directory=/var/www/html
command=/bin/bash -c "cd /var/www/html && /usr/bin/npm run dev -- --host 0.0.0.0"
user=%(ENV_SUPERVISOR_PHP_USER)s
autostart=true
autorestart=true
startsecs=30
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=/bin/bash -c "sleep 5 && php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --timeout=130 --max-time=3600"
user=%(ENV_SUPERVISOR_PHP_USER)s
numprocs=2
autostart=true
autorestart=true
startsecs=10
startretries=10
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
