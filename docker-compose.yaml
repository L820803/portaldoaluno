services:
  laravel.test:
    container_name: app-scie
    build:
      context: .
      dockerfile: docker/development/8.3/Dockerfile
      args:
        WWWGROUP: ${WWWGROUP:-1000}
    image: 'registry-gitlab.portovelho.ro.gov.br/desis/scie-app:1.0'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-9545}:80'
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
      - './app:/var/www/html'
    networks:
      - sail
    depends_on:
      - redis
      - mailpit
  # Captura os e-mails enviados (confirmação de e-mail, recuperação de senha)
  mailpit:
    container_name: portal-aluno-mailpit
    image: 'axllent/mailpit:v1.20'
    ports:
      - '${FORWARD_MAILPIT_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      - sail
  redis:
    container_name: redis
    image: 'redis:alpine'
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'sail-redis:/data'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s
networks:
  sail:
    driver: bridge
volumes:
  sail-redis:
    driver: local
